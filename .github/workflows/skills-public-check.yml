name: Public iOS skills check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proton-pass:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      AI_UI_DERIVED_DATA_PATH: ${{ github.workspace }}/.derivedData/ai-ui
      SIMULATOR_NAME: iPhone 18 Pro
      SIMULATOR_RUNTIME: "27.0"
      SOURCE_BASE: 6aa48ae7f18cb912ee87bc4f4a5581cc76318c07
      SOURCE_HEAD: bd22de62d53815d04feeee2da91c9478e71530a0
    steps:
      - name: Checkout showcase integration
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Apply the reviewed harness to the exact release source
        run: |
          set -euo pipefail
          mkdir -p artifacts/proton-pass
          git diff --binary "$SOURCE_HEAD" HEAD > "$RUNNER_TEMP/skills-overlay.patch"
          git checkout --detach "$SOURCE_HEAD"
          git apply "$RUNNER_TEMP/skills-overlay.patch"
          printf 'Harness commit: %s\nApp source: %s\nComparison base: %s\n' \
            "$GITHUB_SHA" "$(git rev-parse HEAD)" "$SOURCE_BASE" \
            > artifacts/proton-pass/provenance.txt
          shasum -a 256 "$RUNNER_TEMP/skills-overlay.patch" \
            >> artifacts/proton-pass/provenance.txt

      - name: Checkout released UI check
        uses: actions/checkout@v5
        with:
          repository: Kofiloski/ios-ai-ui-check
          ref: bde934737ad068298459d9eaecdd8b176b3f8700 # v0.6.0
          path: .tooling/ios-ai-ui-check
          persist-credentials: false

      - name: Boot the selected Simulator
        run: |
          ./.tooling/ios-ai-ui-check/scripts/boot-simulator.sh "$RUNNER_TEMP/skills-simulator.env"
          source "$RUNNER_TEMP/skills-simulator.env"
          python3 - <<'PY'
          import os
          keys = ("AI_UI_SIMULATOR_UDID", "AI_UI_SIMULATOR_DEVICE_NAME",
                  "AI_UI_SIMULATOR_RUNTIME_ID", "AI_UI_SIMULATOR_RUNTIME_NAME")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for key in keys:
                  output.write(f"{key}={os.environ[key]}\n")
          PY

      - name: Build the real app and public UI target
        run: |
          set -euo pipefail
          bash scripts/skills-build-for-testing.sh 2>&1 | tee artifacts/proton-pass/build.log

      - name: Run baseline UI checks with release context
        uses: ./.tooling/ios-ai-ui-check
        with:
          provided-scenario-path: .github/ai-ui/verify-primary-flow.json
          base-ref: ${{ env.SOURCE_BASE }}
          head-ref: ${{ env.SOURCE_HEAD }}
          release-notes-path: .github/ai-ui/release-notes-1.23.0.md
          simulator-name: ${{ env.SIMULATOR_NAME }}
          simulator-runtime: ${{ env.SIMULATOR_RUNTIME }}
          artifacts-dir: artifacts/proton-pass/ui
          comment-on-pr: "false"
          max-duration-seconds: "400"

      - name: Run existing PRF model tests
        working-directory: LocalPackages/Entities
        run: |
          set -euo pipefail
          xcodebuild test -scheme Entities-Package \
            -destination "platform=iOS Simulator,id=$AI_UI_SIMULATOR_UDID" \
            -derivedDataPath "$GITHUB_WORKSPACE/.derivedData/entities" \
            -resultBundlePath "$GITHUB_WORKSPACE/artifacts/proton-pass/prf-model-tests.xcresult" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -packageAuthorizationProvider netrc -jobs 2 -parallel-testing-enabled NO \
            -only-testing:EntitiesTests/PasskeyAssertionPrfInputTests \
            -only-testing:EntitiesTests/DataHmacSecretSaltTests \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/proton-pass/prf-model-tests.log"

      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proton-pass-public-check
          path: artifacts/proton-pass
          retention-days: 14
